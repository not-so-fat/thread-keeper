[project]
name = "thread-keeper"
version = "0.1.1"
description = "Local-first CLI that collects Claude Code / Codex / Cursor agent session logs into SQLite and exposes pandas query helpers + starter notebooks."
readme = "README.md"
authors = [
    { name = "Yusuke Muraoka", email = "yusuke.muraoka@gokite.ai" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pandas>=2.2",
    "jupytext>=1.16",
]

[project.optional-dependencies]
jupyter = [
    "jupyter>=1.0",
]

[project.scripts]
thread-keeper = "threadkeeper.cli:app"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "threadkeeper"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
